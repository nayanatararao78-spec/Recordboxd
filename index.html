<!--
  Recordboxd frontend
  --------------------
  This is what people actually see and click on. It doesn't store
  any data itself — every time you log an album or load the page,
  it asks the backend (main.py) to do the real work, using "fetch"
  calls (JavaScript's way of talking to an API over the internet).

  Visual direction: vinyl culture / record store / neon nightlife.
  Deep navy + charcoal base, purple-magenta-cyan neon accents,
  warm cream details, large translucent vinyl discs drifting in
  the background, a circular vinyl-groove logo with "RB" at center.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recordboxd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'TGAdventor';
      src: url('https://cdn.jsdelivr.net/gh/Jolg42/FontSquirrel-Fonts@master/Fonts/TeX-Gyre-Adventor/web%20fonts/texgyreadventor_regular_macroman/texgyreadventor-regular-webfont.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'TGAdventor';
      src: url('https://cdn.jsdelivr.net/gh/Jolg42/FontSquirrel-Fonts@master/Fonts/TeX-Gyre-Adventor/web%20fonts/texgyreadventor_bold_macroman/texgyreadventor-bold-webfont.woff') format('woff');
      font-weight: bold;
      font-style: normal;
    }
  </style>
  <style>
    :root {
      --navy: #0d0e1a;
      --charcoal: #15151f;
      --cream: #f3e9d8;
      --magenta: #ff2fb0;
      --cyan: #2ee6e6;
      --purple: #8b5cf6;
      --orange: #ff8a3d;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Poppins', -apple-system, sans-serif;
      margin: 0;
      min-height: 100vh;
      color: var(--cream);
      background:
        radial-gradient(ellipse 70% 50% at 15% 10%, rgba(139,92,246,0.35), transparent 60%),
        radial-gradient(ellipse 60% 45% at 90% 15%, rgba(255,47,176,0.25), transparent 60%),
        radial-gradient(ellipse 60% 50% at 50% 100%, rgba(46,230,230,0.18), transparent 60%),
        linear-gradient(180deg, var(--navy), var(--charcoal));
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
    }
    .vinyl-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .vinyl-bg .disc {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(243,233,216,0.06);
      background:
        repeating-radial-gradient(circle, transparent 0 6px, rgba(243,233,216,0.035) 7px 8px);
    }
    .disc-a { width: 520px; height: 520px; top: -160px; right: -140px; }
    .disc-b { width: 380px; height: 380px; bottom: -120px; left: -100px; border-color: rgba(255,47,176,0.07); }
    .disc-c { width: 260px; height: 260px; bottom: 30%; right: 8%; border-color: rgba(46,230,230,0.08); }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 48px 18px 60px;
    }

    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 36px; }
    .logo { width: 56px; height: 56px; flex-shrink: 0; }
    .brand h1 {
      font-size: 26px;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.5px;
      font-family: 'TGAdventor', 'Poppins', sans-serif;
      background: linear-gradient(90deg, var(--cream), var(--cyan));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand p { margin: 2px 0 0; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: rgba(243,233,216,0.5); font-family: 'Space Mono', monospace; }

    .card {
      background: rgba(21,21,31,0.65);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(243,233,216,0.1);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 28px;
      box-shadow: 0 0 0 1px rgba(139,92,246,0.06), 0 20px 50px rgba(0,0,0,0.35);
    }
    .card-label {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--cyan);
      margin: 0 0 14px;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 13px;
      margin-bottom: 10px;
      border: 1px solid rgba(243,233,216,0.15);
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      background: rgba(13,14,26,0.6);
      color: var(--cream);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input::placeholder, textarea::placeholder { color: rgba(243,233,216,0.35); }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--magenta);
      box-shadow: 0 0 0 3px rgba(255,47,176,0.15);
    }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, var(--magenta), var(--purple));
      color: var(--cream);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      letter-spacing: 0.3px;
      transition: transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(255,47,176,0.25);
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(255,47,176,0.4); }
    button:active { transform: scale(0.98); }

    .stars { cursor: pointer; font-size: 24px; letter-spacing: 4px; margin-bottom: 12px; color: rgba(243,233,216,0.2); }
    .stars span.lit { color: var(--orange); text-shadow: 0 0 12px rgba(255,138,61,0.5); }

    .list-label {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(243,233,216,0.45);
      margin: 0 0 12px 4px;
    }
    .album-row {
      background: rgba(21,21,31,0.55);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      border: 1px solid rgba(243,233,216,0.08);
      border-left: 3px solid var(--cyan);
      position: relative;
      transition: border-color 0.2s;
    }
    .album-row:nth-child(3n+2) { border-left-color: var(--magenta); }
    .album-row:nth-child(3n+3) { border-left-color: var(--purple); }
    .album-row .title { font-weight: 600; font-size: 15px; color: var(--cream); }
    .album-row .artist { font-size: 13px; color: rgba(243,233,216,0.55); margin-top: 1px; }
    .album-row .review { font-size: 13px; color: rgba(243,233,216,0.7); font-style: italic; margin-top: 8px; border-top: 1px solid rgba(243,233,216,0.08); padding-top: 8px; }
    .album-row .delete {
      position: absolute; top: 12px; right: 14px;
      cursor: pointer; color: rgba(243,233,216,0.3);
      font-size: 11px; font-family: 'Space Mono', monospace;
      text-transform: uppercase; letter-spacing: 1px;
      transition: color 0.15s;
    }
    .album-row .delete:hover { color: var(--magenta); }
    .empty {
      text-align: center;
      padding: 30px 16px;
      color: rgba(243,233,216,0.35);
      font-size: 13px;
      font-family: 'Space Mono', monospace;
    }
  </style>
</head>
<body>
  <div class="vinyl-bg">
    <div class="disc disc-a"></div>
    <div class="disc disc-b"></div>
    <div class="disc disc-c"></div>
  </div>

  <div class="wrap">
    <div class="brand">
      <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="48" fill="#0d0e1a" stroke="#2ee6e6" stroke-width="1.2" opacity="0.9"/>
        <circle cx="50" cy="50" r="40" fill="none" stroke="#ff2fb0" stroke-width="0.6" opacity="0.5"/>
        <circle cx="50" cy="50" r="33" fill="none" stroke="#f3e9d8" stroke-width="0.4" opacity="0.25"/>
        <circle cx="50" cy="50" r="26" fill="none" stroke="#f3e9d8" stroke-width="0.4" opacity="0.25"/>
        <circle cx="50" cy="50" r="19" fill="none" stroke="#f3e9d8" stroke-width="0.4" opacity="0.25"/>
        <circle cx="50" cy="50" r="15" fill="#15151f" stroke="#ff2fb0" stroke-width="1"/>
        <text x="50" y="55" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="700" font-size="13" fill="#2ee6e6">RB</text>
        <circle cx="50" cy="50" r="3" fill="#f3e9d8"/>
      </svg>
      <div>
        <h1>Recordboxd</h1>
        <p>Spin. Rate. Remember.</p>
      </div>
    </div>

    <div class="card">
      <p class="card-label">Log a record</p>
      <input id="title" placeholder="Album title" />
      <input id="artist" placeholder="Artist" />
      <div class="stars" id="stars"></div>
      <textarea id="review" placeholder="Quick thoughts (optional)" rows="2"></textarea>
      <button id="logBtn">Add to crate</button>
    </div>

    <p class="list-label">Your crate</p>
    <div id="list"></div>
  </div>

  <script>
    // This is the address of our backend, now live on Railway.
    const API_URL = "https://recordboxd-production.up.railway.app";

    let currentRating = 0;

    function starGlyph(value, pos) {
      if (value >= pos) return "★";
      if (value >= pos - 0.5) return "⯨";
      return "☆";
    }

    function renderStars() {
      const starsEl = document.getElementById("stars");
      starsEl.innerHTML = "";
      for (let i = 1; i <= 5; i++) {
        const span = document.createElement("span");
        span.textContent = starGlyph(currentRating, i);
        span.dataset.pos = i;
        if (currentRating >= i - 0.5) span.classList.add("lit");
        starsEl.appendChild(span);
      }
    }
    document.getElementById("stars").addEventListener("click", (e) => {
      if (!e.target.dataset.pos) return;
      const pos = parseInt(e.target.dataset.pos);
      const rect = e.target.getBoundingClientRect();
      const half = (e.clientX - rect.left) < rect.width / 2;
      currentRating = half ? pos - 0.5 : pos;
      renderStars();
    });
    renderStars();

    // Ask the backend for every album that's been logged, and draw them.
    async function loadAlbums() {
      const res = await fetch(`${API_URL}/albums`);
      const albums = await res.json();
      const list = document.getElementById("list");
      list.innerHTML = "";

      if (albums.length === 0) {
        list.innerHTML = `<div class="empty">Nothing in the crate yet — log your first record above</div>`;
        return;
      }

      albums.forEach(album => {
        const div = document.createElement("div");
        div.className = "album-row";
        let starStr = "";
        for (let i = 1; i <= 5; i++) starStr += starGlyph(album.rating, i);
        div.innerHTML = `
          <span class="delete" data-id="${album.id}">remove</span>
          <div class="title">${album.title}</div>
          <div class="artist">${album.artist} · ${starStr}</div>
          ${album.review ? `<div class="review">"${album.review}"</div>` : ""}
        `;
        list.appendChild(div);
      });
      document.querySelectorAll(".delete").forEach(el => {
        el.addEventListener("click", async () => {
          await fetch(`${API_URL}/albums/${el.dataset.id}`, { method: "DELETE" });
          loadAlbums();
        });
      });
    }

    // Send a new album to the backend to be saved.
    document.getElementById("logBtn").addEventListener("click", async () => {
      const title = document.getElementById("title").value.trim();
      const artist = document.getElementById("artist").value.trim();
      const review = document.getElementById("review").value.trim();
      if (!title || !artist || currentRating === 0) {
        alert("Add a title, artist, and pick a rating first");
        return;
      }
      await fetch(`${API_URL}/albums`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, artist, rating: currentRating, review })
      });
      document.getElementById("title").value = "";
      document.getElementById("artist").value = "";
      document.getElementById("review").value = "";
      currentRating = 0;
      renderStars();
      loadAlbums();
    });

    loadAlbums();
  </script>
</body>
</html>
